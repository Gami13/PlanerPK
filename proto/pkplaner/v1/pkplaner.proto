syntax = "proto3";

package pkplaner.v1;

option go_package = "github.com/woodpkrs/PlanerPK/gen/pkplaner/v1;pkplanerv1";

// PKPlanerService provides RPCs for managing timetable calendar integration.
service PKPlanerService {
  // GetColumns returns available column groups parsed from the Excel header rows.
  rpc GetColumns(GetColumnsRequest) returns (GetColumnsResponse);

  // SetChosenColumn sets the chosen column for the authenticated user.
  rpc SetChosenColumn(SetChosenColumnRequest) returns (SetChosenColumnResponse);

  // SetUserActive sets whether the authenticated account is active.
  rpc SetUserActive(SetUserActiveRequest) returns (SetUserActiveResponse);

  // Authorize exchanges an OAuth code for user credentials and returns user info.
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);

  // GetAuthURL generates a Google OAuth authorization URL.
  rpc GetAuthURL(GetAuthURLRequest) returns (GetAuthURLResponse);

  // GetUserInfo returns information about the authenticated user.
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);

  // GetClasses returns all classes for the authenticated user's chosen column.
  rpc GetClasses(GetClassesRequest) returns (GetClassesResponse);
  // Public, read-only timetable without user-specific overrides.
  rpc GetTimetable(GetTimetableRequest) returns (GetClassesResponse);
  // Groups eligible for adding classes to the authenticated user's timetable.
  rpc GetImportGroups(GetColumnsRequest) returns (GetColumnsResponse);

  // GetOverrides returns all class overrides for the authenticated user.
  rpc GetOverrides(GetOverridesRequest) returns (GetOverridesResponse);

  // SetOverride creates, updates, or deletes a class override for the authenticated user.
  rpc SetOverride(SetOverrideRequest) returns (SetOverrideResponse);
}

// ColumnGroup represents an available column/group option parsed from the Excel header rows.
message ColumnGroup {
  int32  column   = 1;
  string label    = 2;
  string category = 3;
}

// GetColumnsRequest is empty — no parameters needed.
message GetColumnsRequest {}

message GetColumnsResponse {
  repeated ColumnGroup columns = 1;
}

// SetChosenColumnRequest carries the column to select.
message SetChosenColumnRequest {
  int32 chosen_column = 1;
}

message SetChosenColumnResponse {}

// SetUserActiveRequest carries account activity status.
message SetUserActiveRequest {
  bool is_active = 1;
}

message SetUserActiveResponse {}

// AuthorizeRequest carries the OAuth authorization code.
message AuthorizeRequest {
  string code = 1;
}

message AuthorizeResponse {
  string access_token  = 1;
  string email         = 2;
  int64  chosen_column = 3;
  string name          = 4;
  string picture       = 5;
}

// GetAuthURLRequest is empty.
message GetAuthURLRequest {}

message GetAuthURLResponse {
  string url = 1;
}

// GetUserInfoRequest is empty, authentication is handled via headers.
message GetUserInfoRequest {}

message GetUserInfoResponse {
  string email         = 1;
  string name          = 2;
  string given_name    = 3;
  string picture       = 4;
  bool   is_active     = 5;
  int64  chosen_column = 6;
}

// ClassInfo represents a single parsed class from the timetable.
message ClassInfo {
  string hash       = 1;
  string name       = 2;
  string type       = 3;
  string day        = 4;
  string start_time = 5;
  string end_time   = 6;
  string location   = 7;
  string teacher    = 8;
  string audience   = 9;
  // Exact event title used by Google Calendar, including week A/B and other notes.
  string summary    = 10;
  // Original recurrence / scheduling notes (for example A or B).
  string recurrence = 11;
}

// ClassOverride holds the override settings for a single class (identified by hash).
// Sending an override with all fields at their zero values will delete the override.
message ClassOverride {
  string class_hash    = 1;
  string start_hour    = 2; // "HH:MM" or empty for no time shift
  bool   is_hidden     = 3;
  bool   is_transparent = 4;
  // Nonzero includes the referenced class from this source group.
  int32 source_column = 5;
}

// GetClassesRequest is empty — the user's chosen_column is read from auth context.
message GetClassesRequest {}

message GetTimetableRequest {
  int32 column = 1;
}

message GetClassesResponse {
  repeated ClassInfo classes = 1;
}

// GetOverridesRequest is empty — authentication is handled via headers.
message GetOverridesRequest {}

message GetOverridesResponse {
  repeated ClassOverride overrides = 1;
}

message SetOverrideRequest {
  ClassOverride override = 1;
}

message SetOverrideResponse {}
